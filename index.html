<script>

/*************************************************
 * APPS SCRIPT BACKEND
 *************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbyAs-UqyLR2tqfbfgvWxHgIP0We1ll6F8c-Lua7zbtAO4RzSFN30D-6rnhSR-BUHR8EcA/exec';


/*************************************************
 * STATE
 *************************************************/

let scanner;

let processing = false;


/*************************************************
 * RESULT DISPLAY
 *************************************************/

function showResult(message, success) {

  const result =
    document.getElementById('result');

  result.className =
    success ? 'success' : 'error';

  result.innerHTML =
    message;

}


/*************************************************
 * SEND SCAN TO APPS SCRIPT
 *************************************************/

function sendScan(participantId) {

  const device =
    document.getElementById('device').value;

  const activity =
    document.getElementById('activity').value;


  /***********************************************
   * VALIDATE DEVICE
   ***********************************************/

  if (!device) {

    showResult(
      '<strong>Please select a device.</strong>',
      false
    );

    processing = false;

    return;
  }


  /***********************************************
   * VALIDATE ACTIVITY
   ***********************************************/

  if (!activity) {

    showResult(
      '<strong>Please select an activity.</strong>',
      false
    );

    processing = false;

    return;
  }


  /***********************************************
   * SHOW SENDING STATUS
   ***********************************************/

  showResult(

    '<strong>SENDING TO ATTENDANCE SYSTEM...</strong>' +
    '<br><br>' +
    participantId,

    true

  );


  /***********************************************
   * UNIQUE JSONP CALLBACK
   ***********************************************/

  const callbackName =
    'npwCallback_' + Date.now();


  /***********************************************
   * CREATE CALLBACK
   ***********************************************/

  window[callbackName] =
    function(response) {

      console.log(
        'Backend response:',
        response
      );


      /*******************************************
       * SUCCESS
       *******************************************/

      if (response.success) {

        showResult(

          '<strong>✓ SCAN RECORDED</strong>' +
          '<br><br>' +

          '<strong>' +
          response.name +
          '</strong>' +

          '<br>' +
          response.office +

          '<br><br>' +
          response.activity +

          '<br>' +
          response.status,

          true

        );

      }


      /*******************************************
       * DUPLICATE
       *******************************************/

      else if (response.duplicate) {

        showResult(

          '<strong>ALREADY RECORDED</strong>' +
          '<br><br>' +

          '<strong>' +
          response.name +
          '</strong>' +

          '<br>' +
          response.activity,

          false

        );

      }


      /*******************************************
       * OTHER ERROR
       *******************************************/

      else {

        showResult(

          '<strong>SCAN NOT RECORDED</strong>' +
          '<br><br>' +

          response.message,

          false

        );

      }


      /*******************************************
       * ALLOW NEXT SCAN
       *******************************************/

      setTimeout(
        function() {

          processing = false;

          showResult(
            'Ready for next scan',
            false
          );

        },
        3000
      );


      /*******************************************
       * CLEAN UP CALLBACK
       *******************************************/

      delete window[callbackName];

    };


  /***********************************************
   * CREATE JSONP SCRIPT
   ***********************************************/

  const script =
    document.createElement('script');


  script.src =
    API_URL +

    '?action=scan' +

    '&participantId=' +
    encodeURIComponent(
      participantId
    ) +

    '&device=' +
    encodeURIComponent(
      device
    ) +

    '&activity=' +
    encodeURIComponent(
      activity
    ) +

    '&callback=' +
    encodeURIComponent(
      callbackName
    );


  /***********************************************
   * REQUEST ERROR
   ***********************************************/

  script.onerror =
    function() {

      showResult(

        '<strong>UNABLE TO CONTACT ATTENDANCE SYSTEM</strong>',

        false

      );

      processing = false;

      delete window[callbackName];

    };


  /***********************************************
   * ADD REQUEST TO PAGE
   ***********************************************/

  document.body.appendChild(
    script
  );

}


/*************************************************
 * CAMERA SCAN SUCCESS
 *************************************************/

function onScanSuccess(decodedText) {

  /***********************************************
   * PREVENT REPEATED SCANS
   ***********************************************/

  if (processing) {
    return;
  }

  processing = true;


  /***********************************************
   * SHOW DETECTED QR
   ***********************************************/

  showResult(

    '<strong>QR DETECTED</strong>' +
    '<br><br>' +
    decodedText,

    true

  );


  /***********************************************
   * SEND TO BACKEND
   ***********************************************/

  sendScan(
    decodedText
  );

}


/*************************************************
 * NORMAL CAMERA SCAN FAILURE
 *************************************************/

function onScanFailure(error) {

  // Normal scanning failures are ignored.

}


/*************************************************
 * START CAMERA
 *************************************************/

scanner =
  new Html5QrcodeScanner(

    'reader',

    {

      fps: 10,

      qrbox: {
        width: 300,
        height: 300
      },

      rememberLastUsedCamera: true,

      supportedScanTypes: [

        Html5QrcodeScanType.SCAN_TYPE_CAMERA

      ]

    },

    false

  );


/*************************************************
 * START SCANNER
 *************************************************/

scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>
