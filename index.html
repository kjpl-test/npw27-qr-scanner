<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>NPW 2027 QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    #reader {
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
    }

    #result {
      margin: 20px auto;
      padding: 20px;
      max-width: 500px;
      border-radius: 10px;
      background: #eee;
      font-size: 20px;
    }

    .success {
      background: #d9f7df;
    }

    .error {
      background: #ffd9d9;
    }

  </style>

</head>

<body>

  <h1>NPW 2027 QR Scanner</h1>

  <select id="device">

    <option value="">
      Select Device
    </option>

    <option value="REG-01">
      REG-01
    </option>

    <option value="REG-02">
      REG-02
    </option>

    <option value="REG-03">
      REG-03
    </option>

    <option value="SEC-01">
      SEC-01
    </option>

    <option value="SEC-02">
      SEC-02
    </option>

    <option value="SEC-03">
      SEC-03
    </option>

  </select>


  <select id="activity">

    <option value="">
      Select Activity
    </option>

    <option value="Registration">
      Registration
    </option>

    <option value="Opening Session">
      Opening Session
    </option>

    <option value="Morning Session">
      Morning Session
    </option>

    <option value="Lunch">
      Lunch
    </option>

    <option value="Afternoon Session">
      Afternoon Session
    </option>

    <option value="Certificate">
      Certificate
    </option>

  </select>


  <div id="reader"></div>


  <div id="result">
    Waiting for QR code...
  </div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyAs-UqyLR2tqfbfgvWxHgIP0We1ll6F8c-Lua7zbtAO4RzSFN30D-6rnhSR-BUHR8EcA/exec';


let processing = false;


function showResult(message, success) {

  const result =
    document.getElementById('result');

  result.className =
    success ? 'success' : 'error';

  result.innerHTML =
    message;

}


function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  processing = true;


  showResult(

    '<strong>QR DETECTED!</strong>' +
    '<br><br>' +
    decodedText,

    true

  );


  sendScan(decodedText);

}


function onScanFailure(error) {

  // Ignore normal scanning failures.

}


function sendScan(participantId) {

  const device =
    document.getElementById('device').value;

  const activity =
    document.getElementById('activity').value;


  if (!device) {

    showResult(
      '<strong>Please select a device.</strong>',
      false
    );

    processing = false;

    return;

  }


  if (!activity) {

    showResult(
      '<strong>Please select an activity.</strong>',
      false
    );

    processing = false;

    return;

  }


  showResult(

    '<strong>SENDING...</strong>' +
    '<br><br>' +
    participantId,

    true

  );


  const callbackName =
    'npwCallback_' +
    Date.now();


  window[callbackName] =
    function(response) {

      console.log(
        'Backend response:',
        response
      );


      if (response.success) {

        showResult(

          '<strong>✓ SCAN RECORDED</strong>' +
          '<br><br>' +
          '<strong>' +
          response.name +
          '</strong>' +
          '<br>' +
          response.office +
          '<br><br>' +
          response.activity +
          '<br>' +
          response.status,

          true

        );

      }

      else if (response.duplicate) {

        showResult(

          '<strong>ALREADY RECORDED</strong>' +
          '<br><br>' +
          '<strong>' +
          response.name +
          '</strong>' +
          '<br>' +
          response.activity,

          false

        );

      }

      else {

        showResult(

          '<strong>SCAN NOT RECORDED</strong>' +
          '<br><br>' +
          response.message,

          false

        );

      }


      setTimeout(
        function() {

          processing = false;

          showResult(
            'Ready for next scan',
            true
          );

        },
        3000
      );


      delete window[callbackName];

    };


  const script =
    document.createElement('script');


  script.src =
    API_URL +
    '?action=scan' +
    '&participantId=' +
    encodeURIComponent(participantId) +
    '&device=' +
    encodeURIComponent(device) +
    '&activity=' +
    encodeURIComponent(activity) +
    '&callback=' +
    encodeURIComponent(callbackName);


  script.onerror =
    function() {

      showResult(

        '<strong>UNABLE TO CONTACT ATTENDANCE SYSTEM</strong>',

        false

      );

      processing = false;

      delete window[callbackName];

    };


  document.body.appendChild(script);

}


const scanner =
  new Html5QrcodeScanner(

    'reader',

    {

      fps: 10,

      qrbox: {
        width: 300,
        height: 300
      },

      rememberLastUsedCamera: true,

      supportedScanTypes: [

        Html5QrcodeScanType.SCAN_TYPE_CAMERA

      ]

    },

    false

  );


scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>

</html>
