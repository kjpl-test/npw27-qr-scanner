<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NPW Backend Test</title>
</head>

<body>

<h2>NPW 2027 Backend Test</h2>

<button onclick="testScan()">
  Test NPW-CO-01
</button>

<pre id="result">
Waiting...
</pre>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyAs-UqyLR2tqfbfgvWxHgIP0We1ll6F8c-Lua7zbtAO4RzSFN30D-6rnhSR-BUHR8EcA/exec';


function testScan() {

  const callbackName =
    'handleScanResponse';

  const script =
    document.createElement('script');

  script.src =
    API_URL +
    '?action=scan' +
    '&participantId=' +
    encodeURIComponent('NPW-CO-01') +
    '&device=' +
    encodeURIComponent('REG-01') +
    '&activity=' +
    encodeURIComponent('Registration') +
    '&callback=' +
    callbackName;

  document.body.appendChild(script);

}


function handleScanResponse(result) {

  document.getElementById('result').textContent =
    JSON.stringify(
      result,
      null,
      2
    );

}

</script>

</body>
</html>
