```html
<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>QR Camera Test</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    #reader {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    #result {
      margin: 20px auto;
      padding: 20px;
      max-width: 500px;
      border-radius: 10px;
      background: #eee;
      font-size: 20px;
    }

    .success {
      background: #d9f7df;
    }

  </style>

</head>

<body>

  <h1>NPW 2027 QR Test</h1>

  <p>
    Point the camera at a participant QR code.
  </p>

  <div id="reader"></div>

  <div id="result">
    Waiting for QR code...
  </div>


<script>

function onScanSuccess(decodedText) {

  const result =
    document.getElementById('result');

  result.className = 'success';

  result.innerHTML =
    '<strong>QR DETECTED!</strong><br><br>' +
    decodedText;

}


function onScanFailure(error) {

  // Ignore normal scanning failures.
  // The scanner continuously tries again.

}


const scanner =
  new Html5QrcodeScanner(
    'reader',
    {
      fps: 10,

      qrbox: {
        width: 300,
        height: 300
      },

      rememberLastUsedCamera: true,

      supportedScanTypes: [
        Html5QrcodeScanType.SCAN_TYPE_CAMERA
      ]

    },

    false
  );


scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>

</html>
```
