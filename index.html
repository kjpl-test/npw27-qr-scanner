<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>2027 PPCD Planning Worksop Registration</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }


    h1 {
      margin-bottom: 5px;
    }


    .subtitle {
      margin-top: 0;
      color: #666;
    }


    #reader {
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      padding: 10px;
    }


    #result {
      margin: 20px auto;
      padding: 25px;
      max-width: 500px;
      border-radius: 12px;
      background: #eeeeee;
      font-size: 20px;
      min-height: 70px;
      box-sizing: border-box;
    }


    .success {
      background: #d9f7df !important;
    }


    .duplicate {
      background: #fff0c2 !important;
    }


    .error {
      background: #ffdede !important;
    }


    .name {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 10px;
    }


    .status {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 10px;
    }


    .details {
      font-size: 17px;
      line-height: 1.5;
    }

  </style>

</head>


<body>


  <h1>2027 PPCD Planning Worksop</h1>

  <p class="subtitle">
    Registration
  </p>


  <div id="reader"></div>


  <div id="result">

    Waiting for QR code...

  </div>


<script>


/*************************************************
 * APPS SCRIPT API
 *************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbyAs-UqyLR2tqfbfgvWxHgIP0We1ll6F8c-Lua7zbtAO4RzSFN30D-6rnhSR-BUHR8EcA/exec';


/*************************************************
 * SCANNER STATE
 *************************************************/

let processing = false;


/*************************************************
 * DISPLAY RESULT
 *************************************************/

function showResult(
  response
) {

  const result =
    document.getElementById(
      'result'
    );


  if (!response.success) {

    result.className =
      'error';


    result.innerHTML =
      '<div class="status">ERROR</div>' +
      '<div class="details">' +
      response.message +
      '</div>';


    return;

  }


  if (response.alreadyCheckedIn) {

    result.className =
      'duplicate';


    result.innerHTML =

      '<div class="status">' +
      'ALREADY CHECKED IN' +
      '</div>' +

      '<div class="name">' +
      response.name +
      '</div>' +

      '<div class="details">' +
      response.office +
      '<br>' +
      'Registration scan recorded' +
      '</div>';


  }
  else {

    result.className =
      'success';


    result.innerHTML =

      '<div class="status">' +
      'CHECKED IN' +
      '</div>' +

      '<div class="name">' +
      response.name +
      '</div>' +

      '<div class="details">' +
      response.office +
      '</div>';

  }

}


/*************************************************
 * SEND QR TO APPS SCRIPT
 *************************************************/

function sendScan(
  participantId
) {

  const callbackName =
    'npwCallback_' +
    Date.now();


  window[callbackName] =
    function(response) {

      showResult(response);


      // Allow another scan after 2 seconds
      setTimeout(
        function() {

          processing = false;

        },
        2000
      );


      delete window[callbackName];

    };


  const script =
    document.createElement(
      'script'
    );


  script.src =
    API_URL +
    '?action=scan' +
    '&participantId=' +
    encodeURIComponent(
      participantId
    ) +
    '&callback=' +
    callbackName;


  script.onerror =
    function() {

      const result =
        document.getElementById(
          'result'
        );


      result.className =
        'error';


      result.innerHTML =
        '<div class="status">' +
        'CONNECTION ERROR' +
        '</div>' +
        '<div class="details">' +
        'Unable to contact the attendance system.' +
        '</div>';


      processing = false;

      delete window[callbackName];

    };


  document.body.appendChild(
    script
  );

}


/*************************************************
 * QR DETECTED
 *************************************************/

function onScanSuccess(
  decodedText
) {

  if (processing) {

    return;

  }


  processing = true;


  const participantId =
    String(
      decodedText || ''
    ).trim();


  if (!participantId) {

    processing = false;

    return;

  }


  sendScan(
    participantId
  );

}


/*************************************************
 * NORMAL SCANNER FAILURES
 *************************************************/

function onScanFailure(
  error
) {

  // Ignore normal scanning failures.
  // The scanner continuously tries again.

}


/*************************************************
 * START CAMERA
 *************************************************/

const scanner =
  new Html5QrcodeScanner(

    'reader',

    {

      fps: 10,

      qrbox: {
        width: 300,
        height: 300
      },

      rememberLastUsedCamera: true,

      supportedScanTypes: [

        Html5QrcodeScanType.SCAN_TYPE_CAMERA

      ]

    },

    false

  );


scanner.render(
  onScanSuccess,
  onScanFailure
);


</script>

</body>

</html>
