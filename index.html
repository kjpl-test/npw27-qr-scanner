<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyAs-UqyLR2tqfbfgvWxHgIP0We1ll6F8c-Lua7zbtAO4RzSFN30D-6rnhSR-BUHR8EcA/exec';


let processing = false;


/*************************************************
 * SHOW RESULT
 *************************************************/

function showResult(message, success) {

  const result =
    document.getElementById('result');

  result.className =
    success ? 'success' : 'error';

  result.innerHTML =
    message;

}


/*************************************************
 * CAMERA SCAN
 *************************************************/

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  processing = true;

  showResult(
    '<strong>QR DETECTED</strong><br><br>' +
    decodedText,
    true
  );

  sendScan(decodedText);

}


function onScanFailure(error) {

  // Ignore normal scanning failures.

}


/*************************************************
 * SEND TO BACKEND
 *************************************************/

function sendScan(participantId) {

  const device =
    document.getElementById('device').value;

  const activity =
    document.getElementById('activity').value;


  if (!device) {

    showResult(
      '<strong>Please select a device.</strong>',
      false
    );

    processing = false;

    return;
  }


  if (!activity) {

    showResult(
      '<strong>Please select an activity.</strong>',
      false
    );

    processing = false;

    return;
  }


  showResult(
    '<strong>SENDING...</strong><br><br>' +
    participantId,
    true
  );


  const callbackName =
    'npwCallback_' + Date.now();


  window[callbackName] =
    function(response) {

      console.log(
        'Backend response:',
        response
      );


      if (response.success) {

        showResult(

          '<strong>✓ SCAN RECORDED</strong>' +
          '<br><br>' +
          '<strong>' +
          response.name +
          '</strong>' +
          '<br>' +
          response.office +
          '<br><br>' +
          response.activity +
          '<br>' +
          response.status,

          true

        );

      }

      else if (response.duplicate) {

        showResult(

          '<strong>ALREADY RECORDED</strong>' +
          '<br><br>' +
          '<strong>' +
          response.name +
          '</strong>' +
          '<br>' +
          response.activity,

          false

        );

      }

      else {

        showResult(

          '<strong>SCAN NOT RECORDED</strong>' +
          '<br><br>' +
          response.message,

          false

        );

      }


      setTimeout(
        function() {

          processing = false;

          showResult(
            'Ready for next scan',
            false
          );

        },
        3000
      );


      delete window[callbackName];

    };


  const script =
    document.createElement('script');


  script.src =
    API_URL +
    '?action=scan' +
    '&participantId=' +
    encodeURIComponent(participantId) +
    '&device=' +
    encodeURIComponent(device) +
    '&activity=' +
    encodeURIComponent(activity) +
    '&callback=' +
    encodeURIComponent(callbackName);


  script.onerror =
    function() {

      showResult(
        '<strong>UNABLE TO CONTACT ATTENDANCE SYSTEM</strong>',
        false
      );

      processing = false;

      delete window[callbackName];

    };


  document.body.appendChild(script);

}


/*************************************************
 * START CAMERA
 *************************************************/

const scanner =
  new Html5QrcodeScanner(

    'reader',

    {

      fps: 10,

      qrbox: {
        width: 300,
        height: 300
      },

      rememberLastUsedCamera: true,

      supportedScanTypes: [

        Html5QrcodeScanType.SCAN_TYPE_CAMERA

      ]

    },

    false

  );


scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>
